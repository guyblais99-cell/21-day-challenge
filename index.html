<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Power Planner</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6366f1">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/480/dumbbell.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/dumbbell.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'fire': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;900&display=swap');
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .glass {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 min-h-screen p-4 md:p-8 font-sans text-gray-800 pb-20 select-none">

    <div id="app" class="max-w-2xl mx-auto">
        
        <header class="flex justify-between items-center mb-6 text-white">
            <div>
                <h1 class="text-3xl font-black tracking-tight italic uppercase">Power Planner</h1>
                <p class="text-indigo-100 text-xs font-light opacity-80">Built for Consistency</p>
            </div>
            <button onclick="alert('To install: Tap your browser menu (⋮) and select \'Add to Home Screen\'')" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded-full backdrop-blur-sm transition">
                📲 Install App
            </button>
        </header>

        <div id="setup-container" class="hidden glass rounded-3xl shadow-2xl p-6 md:p-8 transform transition-all animate-fade-in">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2">🏋️</div>
                <h2 class="text-2xl font-bold text-gray-900">New Routine</h2>
                <p class="text-gray-500 text-sm">Define your commitment.</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Plan Name</label>
                    <input type="text" id="challenge-title" value="My Fitness Journey" 
                        class="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-lg font-bold outline-none transition-all" 
                        placeholder="e.g. Summer Shred">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Start Date</label>
                    <input type="date" id="start-date" 
                        class="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-indigo-500 text-lg outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Frequency</label>
                    <div class="relative">
                        <select id="frequency-select" class="w-full p-4 bg-white border border-gray-200 rounded-xl focus:border-indigo-500 text-lg outline-none appearance-none font-medium">
                            <option value="every-day">🔥 Every Day (Beast Mode)</option>
                            <option value="every-other">⚖️ Every Other Day</option>
                            <option value="weekdays">💼 Weekdays Only (Mon-Fri)</option>
                            <option value="weekends">☀️ Weekends Only (Sat-Sun)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-400">▼</div>
                    </div>
                </div>

                <button id="start-challenge-btn"
                    class="w-full py-4 mt-2 bg-gray-900 hover:bg-black text-white text-lg font-bold rounded-xl shadow-xl transform active:scale-95 transition-all duration-200">
                    Create Plan 🚀
                </button>
            </div>
        </div>

        <div id="challenge-container" class="hidden space-y-5">
            
            <div id="today-widget" class="relative overflow-hidden rounded-3xl shadow-2xl p-6 md:p-8 text-white transition-all duration-500 group">
                <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                
                <div class="relative z-10 flex flex-col items-center text-center">
                    <div class="uppercase tracking-widest text-[10px] font-bold bg-black/20 px-3 py-1 rounded-full mb-3 backdrop-blur-md">
                        Today's Status
                    </div>
                    
                    <div id="widget-icon" class="text-6xl md:text-7xl mb-2 drop-shadow-md transition-transform duration-300 group-hover:scale-110">💪</div>
                    <h2 id="widget-title" class="text-4xl md:text-5xl font-black uppercase leading-none mb-1 drop-shadow-sm">GO TIME</h2>
                    <p id="widget-subtitle" class="text-lg md:text-xl font-medium opacity-90 mb-6">Upper Body Focus</p>
                    
                    <button id="mark-today-btn" class="w-full md:w-auto px-8 py-3 bg-white text-gray-900 font-bold rounded-xl shadow-lg hover:bg-gray-50 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span>Complete Workout</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg border-b-4 border-orange-500">
                    <div class="text-3xl font-black text-orange-500 flex items-center gap-1">
                        <span id="streak-count">0</span>
                        <span class="text-2xl animate-fire">🔥</span>
                    </div>
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Current Streak</div>
                </div>

                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center shadow-lg border-b-4 border-indigo-500">
                    <div class="text-3xl font-black text-indigo-600" id="progress-percent">0%</div>
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Consistency</div>
                </div>
            </div>

            <div class="glass rounded-3xl p-5 shadow-xl">
                <div class="flex justify-between items-end mb-4 px-1">
                    <div>
                        <h3 id="display-title" class="text-lg font-bold text-gray-800 leading-tight">My Plan</h3>
                        <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wide">30 Day Cycle</p>
                    </div>
                    <button id="reset-btn" class="text-[10px] text-red-400 hover:text-red-600 font-bold uppercase tracking-wider border border-red-100 px-3 py-1 rounded-full hover:bg-red-50 transition">
                        Restart
                    </button>
                </div>
                
                <div id="challenge-grid" class="grid grid-cols-5 md:grid-cols-7 gap-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const PLAN_LENGTH = 30;
        const LOCAL_STORAGE_KEY = 'WorkoutPlanner_Ultimate_v4_Fixed';

        const setupContainer = document.getElementById('setup-container');
        const challengeContainer = document.getElementById('challenge-container');
        const startDateInput = document.getElementById('start-date');
        const titleInput = document.getElementById('challenge-title');
        const frequencySelect = document.getElementById('frequency-select');
        const grid = document.getElementById('challenge-grid');
        
        const widget = document.getElementById('today-widget');
        const widgetTitle = document.getElementById('widget-title');
        const widgetSubtitle = document.getElementById('widget-subtitle');
        const widgetIcon = document.getElementById('widget-icon');
        const markTodayBtn = document.getElementById('mark-today-btn');
        
        const streakCountEl = document.getElementById('streak-count');
        const progressPercentEl = document.getElementById('progress-percent');

        // --- NEW SAFE DATE HANDLERS (Timezone Proof) ---
        
        // 1. Convert Date Object to "YYYY-MM-DD" using LOCAL time
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 2. Parse "YYYY-MM-DD" string into a Date Object set to LOCAL midnight
        function parseDateLocal(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // 3. Add days to a Date object safely
        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        // --- CORE LOGIC ---

        function isWorkoutDay(startDateStr, currentDayStr, frequency) {
            const start = parseDateLocal(startDateStr);
            const current = parseDateLocal(currentDayStr);
            
            // Calculate difference in days
            const diffTime = Math.round((current - start) / (1000 * 60 * 60 * 24));
            const dayOfWeek = current.getDay(); // 0=Sun, 1=Mon

            if (diffTime < 0) return false; // Date is before start date
            if (diffTime === 0) return true; // Start Date is ALWAYS a workout day

            switch (frequency) {
                case 'every-day': return true;
                case 'every-other': return diffTime % 2 === 0;
                case 'weekdays': return dayOfWeek >= 1 && dayOfWeek <= 5;
                case 'weekends': return dayOfWeek === 0 || dayOfWeek === 6;
                default: return true;
            }
        }

        function calculateStreak(data) {
            let streak = 0;
            const today = new Date(); // Local now
            const start = parseDateLocal(data.startDate);

            // Loop backwards from today
            for (let i = 0; i < 365; i++) {
                const checkDate = new Date(today);
                checkDate.setDate(today.getDate() - i); // Go back i days
                
                // Stop if we went before the start date
                // We compare timestamps to be safe
                if (checkDate.setHours(0,0,0,0) < start.getTime()) break;

                const checkString = formatDateLocal(checkDate);
                const scheduled = isWorkoutDay(data.startDate, checkString, data.frequency);
                const completed = data.completedDays[checkString];

                // Logic for TODAY (i=0)
                if (i === 0) {
                    if (completed) streak++;
                    continue; // Continue to check yesterday
                }

                // Logic for PAST DAYS
                if (scheduled) {
                    if (completed) {
                        streak++;
                    } else {
                        // If it was a workout day and we missed it, streak ends.
                        break;
                    }
                }
                // If it was a Rest Day, we just ignore it and keep the streak alive
            }
            return streak;
        }

        function createPlan() {
            const title = titleInput.value || "My Plan";
            const startStr = startDateInput.value;
            const freq = frequencySelect.value;
            
            if(!startStr) { alert("Please pick a start date!"); return; }

            const data = { title, startDate: startStr, frequency: freq, completedDays: {} };
            saveData(data);
            renderApp();
        }

        function saveData(data) { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data)); }
        
        function loadData() { 
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            return raw ? JSON.parse(raw) : null; 
        }

        function renderWidget(data) {
            const today = new Date();
            const todayStr = formatDateLocal(today); // Use safe local formatter
            const isScheduled = isWorkoutDay(data.startDate, todayStr, data.frequency);
            const isDone = data.completedDays[todayStr];

            widgetIcon.classList.remove('animate-bounce-slow');

            if (isDone) {
                widget.className = "relative overflow-hidden rounded-3xl shadow-2xl p-6 md:p-8 text-white mb-6 bg-gradient-to-r from-emerald-500 to-teal-600";
                widgetTitle.textContent = "CRUSHED IT!";
                widgetSubtitle.textContent = "Great job today.";
                widgetIcon.textContent = "✅";
                markTodayBtn.classList.add('hidden');
            } else if (isScheduled) {
                widget.className = "relative overflow-hidden rounded-3xl shadow-2xl p-6 md:p-8 text-white mb-6 bg-gradient-to-r from-orange-500 to-rose-600 shadow-orange-500/30";
                widgetTitle.textContent = "WORKOUT DAY";
                widgetSubtitle.textContent = "Keep the streak alive!";
                widgetIcon.textContent = "🔥";
                widgetIcon.classList.add('animate-bounce-slow');
                markTodayBtn.classList.remove('hidden');
                markTodayBtn.innerHTML = "<span>Mark Complete</span>";
                markTodayBtn.onclick = () => toggleDay(todayStr);
            } else {
                widget.className = "relative overflow-hidden rounded-3xl shadow-2xl p-6 md:p-8 text-white mb-6 bg-gradient-to-r from-blue-400 to-indigo-500";
                widgetTitle.textContent = "REST DAY";
                widgetSubtitle.textContent = "Recover & Relax.";
                widgetIcon.textContent = "🧘";
                markTodayBtn.classList.add('hidden');
            }
        }

        function renderGrid(data) {
            grid.innerHTML = '';
            let completedCount = 0;
            let totalWorkoutDaysSoFar = 0;
            
            const today = new Date();
            const todayStr = formatDateLocal(today);
            const startObj = parseDateLocal(data.startDate);

            for(let i=0; i < PLAN_LENGTH; i++) {
                const d = addDays(startObj, i);
                const dateStr = formatDateLocal(d);
                
                const isScheduled = isWorkoutDay(data.startDate, dateStr, data.frequency);
                const isDone = data.completedDays[dateStr];
                
                // Compare strings to avoid time checking issues
                const isToday = (dateStr === todayStr);
                const isPast = (d < new Date().setHours(0,0,0,0));

                if (isScheduled && (isPast || isToday)) totalWorkoutDaysSoFar++;
                if (isScheduled && isDone) completedCount++;

                // Visuals
                const card = document.createElement('div');
                let bgClass = isScheduled 
                    ? (isDone ? "bg-indigo-600 text-white shadow-indigo-300" : "bg-white text-gray-800 border-gray-200") 
                    : "bg-gray-100 text-gray-300 border-transparent";
                
                // Highlight Today
                if (isScheduled && !isDone && isToday) bgClass = "bg-orange-100 text-orange-800 border-orange-200 ring-2 ring-orange-400";

                card.className = `flex flex-col items-center justify-center p-2 rounded-xl border-2 transition-all cursor-pointer relative h-20 ${bgClass}`;
                
                const dayName = d.toLocaleDateString('en-US', { weekday: 'narrow' });
                
                const checkMarkHTML = isDone 
                    ? `<div class="absolute inset-0 flex items-center justify-center rounded-xl bg-indigo-600/10">
                         <span class="text-4xl font-black text-white drop-shadow-md">✓</span>
                       </div>` 
                    : '';

                card.innerHTML = `
                    <span class="text-[10px] font-bold uppercase">${dayName}</span>
                    <span class="text-xl font-bold">${d.getDate()}</span>
                    ${checkMarkHTML}
                `;

                if (isScheduled) card.onclick = () => toggleDay(dateStr);
                grid.appendChild(card);
            }

            const percent = totalWorkoutDaysSoFar === 0 ? 0 : Math.round((completedCount / totalWorkoutDaysSoFar) * 100);
            progressPercentEl.textContent = `${percent}%`;
            streakCountEl.textContent = calculateStreak(data);
            document.getElementById('display-title').textContent = data.title;
        }

        function toggleDay(dateStr) {
            const data = loadData();
            if(!data) return;
            data.completedDays[dateStr] = !data.completedDays[dateStr];
            saveData(data);
            renderApp();
        }

        function renderApp() {
            const data = loadData();
            if (data) {
                setupContainer.classList.add('hidden');
                challengeContainer.classList.remove('hidden');
                renderWidget(data);
                renderGrid(data);
            } else {
                setupContainer.classList.remove('hidden');
                challengeContainer.classList.add('hidden');
            }
        }

        document.getElementById('start-challenge-btn').addEventListener('click', createPlan);
        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm("Delete current plan?")) { localStorage.removeItem(LOCAL_STORAGE_KEY); renderApp(); }
        });

        startDateInput.value = formatDateLocal(new Date());

        renderApp();
    </script>
</body>
</html>
